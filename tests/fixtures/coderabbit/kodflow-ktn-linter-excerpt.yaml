# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# An EXCERPT of kodflow/ktn-linter's .coderabbit.yaml as of 2026-11-09. That
# repository is private, so only its generic blocks are reproduced here: what
# matters for the migration is the shape — the exclusion written by hand in the
# middle of auto_review, its titles mixed with the repository's own keywords,
# inheritance off, and comments everywhere.

language: en-US

tone_instructions: >-
  Concise and technical. Expert Go audience. Focus on correctness, performance,
  Go idioms.

early_access: true
enable_free_tier: true
inheritance: false

reviews:
  profile: assertive
  # request_changes_workflow=true: a comment that must survive the migration.
  request_changes_workflow: true
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  abort_on_close: true

  auto_review:
    # Sync PRs opened by kodflow-ci[bot] (post-commit enforce, runner-template) are
    # excluded from review to save the CodeRabbit quota; the same lists live in
    # kodflow/making.codes coderabbit/override-*.yaml.
    ignore_usernames:
      - "kodflow-ci[bot]"
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - WIP
      - DO NOT MERGE
      - DRAFT
      - "ci(post-commit): sync the gate workflow with the central stub"
      - "ci(runner-template): sync the stubs with kodflow/post-commit"
      - "ci: add the mandatory post-commit gate"
      - "ci: run every job on the self-hosted kodflow-runner"
    drafts: false
    base_branches:
      - main

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  pre_merge_checks:
    title:
      mode: error
      requirements: >-
        Must follow conventional commits: type(scope): description.
    description:
      mode: error

  path_filters:
    - "!**/.devcontainer/**"
    - "!**/go.sum"

  path_instructions:
    - path: "**/testdata/**"
      instructions: >-
        STOP: These are INTENTIONAL lint test fixtures for analysistest.Run().
        DO NOT review code quality, style, or correctness in these files.

chat:
  auto_reply: true
