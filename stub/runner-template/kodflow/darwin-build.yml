# darwin-build — a runner-template stub, written and kept in sync by
# kodflow/post-commit (stub/runner-template/kodflow/darwin-build.yml, scripts/enforce.sh).
# A change made here is reverted by the next sync: change it there.
#
# The logic is kodflow/runner-template's reusable-darwin-build.yml at the commit
# pinned below. The same SHA goes in `ref`: `uses:` takes no expression, and
# the called jobs read that repository's scripts at `ref`. The run, its log
# and its artifacts are this repository's, and so are the private-source
# environment and the kodflow-ci App key the called jobs read. The pin moves
# with kodflow/post-commit's scripts/bump-runner-template.sh.
#
# Called by kodflow/immobilier (release) and kodflow/ssm-gui (build), which
# allowlist themselves in the reusable workflow.
name: darwin-build
# The caller finds its run by this exact title: `darwin-build <request id>`.
run-name: darwin-build ${{ github.event.client_payload.request_id }}

on:
  repository_dispatch:
    types: [darwin-build]

permissions:
  contents: read

concurrency:
  group: darwin-build-${{ github.event.client_payload.request_id }}
  cancel-in-progress: true

jobs:
  darwin-build:
    uses: kodflow/runner-template/.github/workflows/reusable-darwin-build.yml@2b09ce738ae9f32cc437e7377bc974a141f2f454
    with:
      ref: 2b09ce738ae9f32cc437e7377bc974a141f2f454
      payload: ${{ toJSON(github.event.client_payload) }}
