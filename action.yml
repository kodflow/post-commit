# kodflow/post-commit — composite action behind the mandatory `post-commit`
# status. A caller's job named `post-commit` with a single `uses:` step is
# the whole integration; the check name is therefore exactly "post-commit",
# which is what the fleet rulesets require.
name: post-commit
description: >-
  Mandatory merge gate: every commit authored by an allowed account, no AI
  attribution anywhere in history, conventional commit subjects, no
  credentials added. Logic lives in kodflow/post-commit —
  callers pin @main so a fix there is live everywhere on the next run.
branding:
  icon: shield
  color: red

inputs:
  authors:
    description: >-
      Space/comma separated GitHub logins allowed to author and commit. Each
      expands to that account's noreply address, with or without the numeric
      id prefix. GitHub's own merge committer and app/bot accounts are always
      accepted on top. Empty (the default) disables the check.
    default: ''
  strict:
    description: Also apply patterns-strict.txt (bare vendor keywords, .claude/ paths).
    default: 'false'
  history:
    description: >-
      full — scan every commit reachable from the head (default: one tainted
      commit anywhere blocks until history is rewritten). range — only the
      commits this push/PR introduces.
    default: 'full'
  format:
    description: Enforce conventional-commit subjects on the range's non-merge commits.
    default: 'true'
  secrets:
    description: Scan the range's added lines for credential shapes.
    default: 'true'
  token:
    description: Token used to check out the calling repository.
    default: ${{ github.token }}

outputs:
  passed:
    description: '"true" when the gate found nothing, "false" otherwise.'
    value: ${{ steps.gate.outputs.passed }}
  report:
    description: >-
      The verdict as markdown — the same text the job summary carries. A
      caller can post it where the author will see it. Capped at 60 kB, which
      is well under the pull-request comment limit.
    value: ${{ steps.gate.outputs.report }}

runs:
  using: composite
  steps:
    # fetch-depth 0 is required: full-history mode walks every ancestor and
    # range mode needs the merge base. On pull_request we check out the real
    # head, not GitHub's synthetic merge commit, so `base..head` is exactly
    # the PR's own commits.
    - name: Checkout caller (full history)
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        # Tags are not optional here: the push and manual paths scan every
        # branch AND every tag, and checkout does not bring tags along on its
        # own. Without this the whole-repository scan would quietly cover less
        # than it claims.
        fetch-tags: true
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        token: ${{ inputs.token }}
        persist-credentials: false

    - name: Resolve head and range
      id: rev
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "pull_request_target" ]; then
          HEAD="$PR_HEAD"
          RANGE="${PR_BASE}..${PR_HEAD}"
        elif [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "schedule" ]; then
          # Not the pushed commit: every branch and every tag.
          #
          # A pull request is judged on its own ancestry, which is the right
          # scope for a merge decision and keeps it fast. But that scope never
          # sees a tag. A tag can hold commits no branch reaches any more —
          # 171 of them on one fleet repo, carrying a personal identity that
          # every branch-only scan had called clean — and nothing would ever
          # report them, because no pull request walks there.
          #
          # Push and manual runs are not deciding a merge, so they can afford
          # the whole repository. Format and secrets stay on the range: they
          # are about what a change introduces, not what the archive holds.
          HEAD="--branches"
          RANGE=""
          echo "::notice::whole-repository scan: every branch and every tag"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD range=<none>"
          exit 0
        else
          HEAD="$SHA"
          # github.event.before is all-zeros for a new branch and points at an
          # orphaned commit after a force-push; neither resolves, so fall back
          # to the tip commit instead of failing the job on a bad range.
          ZERO=0000000000000000000000000000000000000000
          if [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$ZERO" ] \
             && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${PUSH_BEFORE}..${SHA}"
          elif git cat-file -e "${SHA}~1^{commit}" 2>/dev/null; then
            echo "::notice::no resolvable 'before' commit (new branch or force-push) — range is the tip commit only"
            RANGE="${SHA}~1..${SHA}"
          else
            RANGE=""
          fi
        fi
        echo "head=$HEAD" >> "$GITHUB_OUTPUT"
        echo "range=$RANGE" >> "$GITHUB_OUTPUT"
        echo "head=$HEAD range=${RANGE:-<none>}"

    # The gate runs here and always exits 0; the verdict is a separate step.
    # A composite step that fails takes its outputs down with it, and the
    # whole point of `report` is to be readable BY the job that reacts to a
    # failure. Splitting keeps the failure exact and the report available.
    - name: post-commit
      id: gate
      shell: bash
      env:
        PC_AUTHORS: ${{ inputs.authors }}
        PC_STRICT: ${{ inputs.strict }}
        PC_HISTORY: ${{ inputs.history }}
        PC_FORMAT: ${{ inputs.format }}
        PC_SECRETS: ${{ inputs.secrets }}
        PC_REPORT: ${{ runner.temp }}/post-commit-report.md
      run: |
        rc=0
        bash "${{ github.action_path }}/scripts/post-commit.sh" \
          "${{ steps.rev.outputs.head }}" "${{ steps.rev.outputs.range }}" || rc=$?
        if [ "$rc" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"
        else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
        # A random delimiter: the report is arbitrary markdown built from commit
        # subjects, so a fixed sentinel is a line an author could write.
        D="PCEOF_${RANDOM}${RANDOM}"
        {
          echo "report<<$D"
          head -c 60000 "$PC_REPORT" 2>/dev/null || true
          echo ""
          echo "$D"
        } >> "$GITHUB_OUTPUT"
        # A usage or internal error (exit 2) is not a verdict — fail here and
        # now rather than let the verdict step read it as a mere violation.
        [ "$rc" -le 1 ] || exit "$rc"

    - name: verdict
      shell: bash
      run: |
        [ "${{ steps.gate.outputs.passed }}" = "true" ] && exit 0
        echo "::error::post-commit refused this history — see the job summary."
        exit 1
