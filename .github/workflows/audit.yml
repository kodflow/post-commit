# Historical audit — REPORT ONLY.
#
# Scans `git log --all` of the calling repo and reports every commit already
# carrying AI attribution. It NEVER rewrites history: cleaning these commits
# means a full-history rebase + force-push, which rewrites every SHA, breaks
# every open PR and every existing clone, and is irreversible on published
# work. That is a per-repo human decision, not something a scheduled job gets
# to make. See README.md § "Cleaning a tainted history".
#
# Deliberately NOT wired to push/pull_request — scanning all history on every
# commit is pure waste. Manual dispatch or schedule only.
name: commit-guard-audit

on:
  workflow_call:
    inputs:
      strict:
        type: boolean
        default: false
        required: false
      guard_ref:
        type: string
        default: main
        required: false
  workflow_dispatch:
    inputs:
      strict:
        description: Also apply the strict pattern set
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller (full history, all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout guard
        uses: actions/checkout@v4
        with:
          repository: kodflow/commit-guard-action
          ref: ${{ inputs.guard_ref || 'main' }}
          path: .commit-guard

      # continue-on-error: a tainted history is a pre-existing condition being
      # reported, not a regression introduced by this run. Failing the job
      # would just make the audit look broken on every repo that needs it.
      - name: Audit all history
        id: audit
        continue-on-error: true
        env:
          GUARD_STRICT: ${{ inputs.strict }}
          GUARD_SECRETS: false
          GUARD_MAX_REPORT: 500
        run: bash .commit-guard/scripts/ci-guard.sh --all

      - name: Report
        run: |
          if [ "${{ steps.audit.outcome }}" = "failure" ]; then
            echo "::warning::This repository has commits carrying AI attribution. See the job summary. Nothing was rewritten."
            {
              echo ""
              echo "> **Nothing was rewritten.** Cleaning these commits requires a"
              echo "> full-history rebase and force-push, which changes every SHA and"
              echo "> breaks open PRs and existing clones. That is a deliberate,"
              echo "> per-repo decision — see the central repo's README."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "History is clean."
          fi
