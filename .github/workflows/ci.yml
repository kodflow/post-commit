# Self-test. A bad pattern here is live in every repo on the next run, so
# the gate's own logic is verified before it can propagate.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          # python3-jsonschema is the schema oracle tests/run.sh requires in
          # CI: it holds coderabbit.py's built-in validator to the reference
          # implementation. It is installed here, in a job holding no token,
          # and never in the enforce job.
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck python3-jsonschema
          shellcheck -S warning scripts/*.sh tests/*.sh
      - name: behaviour tests
        run: bash tests/run.sh
      # The runner-template stubs pin one commit of kodflow/runner-template:
      # it must be on that repository's main and carry every workflow they
      # call, or the next enforce run would roll a dead pin out to every
      # owner. Reads the public repository anonymously.
      - name: runner-template pin
        run: bash scripts/bump-runner-template.sh --verify
      - name: validate YAML
        run: |
          python3 - <<'PY'
          import yaml, glob
          for f in ['action.yml', 'block-merge/action.yml', 'stub/post-commit.yml'] + sorted(glob.glob('stub/runner-template/*/*.yml')) + sorted(glob.glob('stub/coderabbit/**/*.yaml', recursive=True)) + sorted(glob.glob('coderabbit/**/*.yaml', recursive=True)) + sorted(glob.glob('.github/workflows/*.yml')):
              yaml.safe_load(open(f)); print('ok', f)
          PY

  # Dogfood: this repo is gated by the exact version of the action under review.
  post-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          authors: kodflow
