# Self-test. A bad pattern here is live in every repo on the next run, so
# the gate's own logic is verified before it can propagate.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh tests/run.sh
      - name: behaviour tests
        run: bash tests/run.sh
      - name: validate YAML
        run: |
          python3 - <<'PY'
          import yaml, glob
          for f in ['action.yml', 'stub/post-commit.yml'] + sorted(glob.glob('.github/workflows/*.yml')):
              yaml.safe_load(open(f)); print('ok', f)
          PY

  # Dogfood: this repo is gated by the exact version of the action under review.
  post-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          authors: kodflow
          # range, not the default full: this repository's own history still
          # carries a personal identity on every commit, so a full scan would
          # fail the very PR that introduces the rule. Drop this line once
          # scripts/rewrite-history.sh has run here — the fleet stub is on
          # the same footing and flips back the same way.
          history: range
