name: ci
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - name: flow migration tooling
      run: python -m pip install --disable-pip-version-check -r flow/requirements.txt
    - name: shellcheck
      run: 'sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

        shellcheck -S warning scripts/*.sh tests/*.sh

        '
    - name: behaviour tests
      run: bash tests/run.sh
    - name: flow admission and rollout tests
      run: python -m unittest discover -s flow -p 'test_*.py' -v
    - name: runner-template pin
      run: bash scripts/bump-runner-template.sh --verify
    - name: validate YAML
      run: "python3 - <<'PY'\nimport yaml, glob\nfor f in ['action.yml', 'block-merge/action.yml', 'stub/post-commit.yml']\
        \ + sorted(glob.glob('stub/runner-template/*/*.yml')) + sorted(glob.glob('.github/workflows/*.yml')):\n    yaml.safe_load(open(f));\
        \ print('ok', f)\nPY\n"
    timeout-minutes: 20
  post-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: ./
      with:
        authors: kodflow
