# Self-test: the guard's own logic must be verified here, or a bad pattern
# silently propagates to every repo in the fleet on the next run.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/ci-guard.sh tests/run.sh
      - name: Guard behaviour tests
        run: bash tests/run.sh
      - name: Validate workflow YAML
        run: |
          python3 - <<'PY'
          import yaml, glob, sys
          for f in sorted(glob.glob('.github/workflows/*.yml')) + ['stub/post-commit.yml']:
              yaml.safe_load(open(f))
              print(f"ok {f}")
          PY

  # Dogfood: this repo runs its own guard on its own PRs.
  guard:
    uses: ./.github/workflows/commit-guard.yml
